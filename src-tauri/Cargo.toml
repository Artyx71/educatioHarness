[package]
name = "educatio-harness"
version = "0.1.0"
edition = "2021"

[lib]
name = "educatio_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
thiserror = "2"
tauri-plugin-dialog = "2.8.4"
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.3"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
